{% extends "base.html" %}
{% block title %}Plan — SmartBite{% endblock %}
{% block content %}
<div class="eyebrow" style="display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--marigold-deep);background:var(--marigold-soft);padding:4px 12px;border-radius:20px;margin-bottom:14px;">7-day plan · real Indian meal &amp; ingredient prices</div>
<h1 style="font-size:32px;margin:0 0 20px;">{{ 'Update' if profile else 'Set up' }} your profile</h1>
<div class="card"><form method="post" id="setupForm">
<div class="grid3">
<div class="field"><label>Weight (kg)</label><input type="number" name="weight" value="{{ profile['weight'] if profile else 70 }}" min="30" max="200" required></div>
<div class="field"><label>Height (cm)</label><input type="number" name="height" value="{{ profile['height'] if profile else 170 }}" min="120" max="220" required></div>
<div class="field"><label>Age (years)</label><input type="number" name="age" value="{{ profile['age'] if profile else 28 }}" min="14" max="90" required></div></div>
<div class="field"><label>Gender <span class="hint">(used only for BMR accuracy)</span></label><div class="choice-group" data-target="gender"><div class="choice {{ 'selected' if not profile or profile['gender']=='male' }}" data-value="male">Male</div><div class="choice {{ 'selected' if profile and profile['gender']=='female' }}" data-value="female">Female</div></div><input type="hidden" name="gender" id="gender" value="{{ profile['gender'] if profile else 'male' }}"></div>
<div class="field"><label>Activity level</label><select name="activity"><option value="1.2" {{ 'selected' if profile and profile['activity']==1.2 }}>Sedentary — desk job, little exercise</option><option value="1.375" {{ 'selected' if not profile or profile['activity']==1.375 }}>Light — 1–3 workouts/week</option><option value="1.55" {{ 'selected' if profile and profile['activity']==1.55 }}>Moderate — 3–5 workouts/week</option><option value="1.725" {{ 'selected' if profile and profile['activity']==1.725 }}>Active — 6–7 workouts/week</option><option value="1.9" {{ 'selected' if profile and profile['activity']==1.9 }}>Very active — physical job + training</option></select></div>
<div class="grid2"><div class="field"><label>Diet type</label><div class="choice-group" data-target="diet"><div class="choice {{ 'selected' if not profile or profile['diet']=='veg' }}" data-value="veg">Vegetarian</div><div class="choice {{ 'selected' if profile and profile['diet']=='non-veg' }}" data-value="non-veg">Non-veg</div><div class="choice {{ 'selected' if profile and profile['diet']=='mixed' }}" data-value="mixed">Mixed</div></div><input type="hidden" name="diet" id="diet" value="{{ profile['diet'] if profile else 'veg' }}"></div>
<div class="field"><label>Goal</label><div class="choice-group" data-target="goal"><div class="choice {{ 'selected' if profile and profile['goal']=='loss' }}" data-value="loss">Lose weight</div><div class="choice {{ 'selected' if not profile or profile['goal']=='maintain' }}" data-value="maintain">Maintain</div><div class="choice {{ 'selected' if profile and profile['goal']=='gain' }}" data-value="gain">Gain / muscle</div></div><input type="hidden" name="goal" id="goal" value="{{ profile['goal'] if profile else 'maintain' }}"></div></div>
<div class="grid2"><div class="field"><label>Monthly food budget (₹)</label><input type="number" name="budget" value="{{ profile['budget']|int if profile else 4500 }}" min="500" step="100" required></div><div class="field"><label>Meals per day</label><select name="meals_per_day"><option value="2" {{ 'selected' if profile and profile['meals_per_day']==2 }}>2</option><option value="3" {{ 'selected' if not profile or profile['meals_per_day']==3 }}>3</option><option value="4" {{ 'selected' if profile and profile['meals_per_day']==4 }}>4</option></select></div></div>
<div class="grid2"><div class="field"><label>Custom daily calorie goal <span class="hint">(optional)</span></label><input type="number" name="custom_calories" placeholder="e.g. 2200" value="{{ profile['custom_calories']|int if profile and profile['custom_calories'] else '' }}"></div><div class="field"><label>Custom daily protein target (g) <span class="hint">(optional)</span></label><input type="number" name="custom_protein" placeholder="e.g. 110" value="{{ profile['custom_protein']|int if profile and profile['custom_protein'] else '' }}"></div></div>
<button class="btn-primary" type="submit">Generate my 7-day plan →</button></form></div>
<script>document.querySelectorAll(".choice-group").forEach(group=>{group.addEventListener("click",e=>{const el=e.target.closest(".choice");if(!el)return;group.querySelectorAll(".choice").forEach(c=>c.classList.remove("selected"));el.classList.add("selected");document.getElementById(group.dataset.target).value=el.dataset.value;});});</script>
{% endblock %}
