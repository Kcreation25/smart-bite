{% extends "base.html" %}
{% block title %}Sign up — SmartBite{% endblock %}
{% block content %}
<div class="auth-wrap"><h1 style="font-size:26px;margin-bottom:6px;">Create your account</h1><p style="color:var(--ink-soft);font-size:14px;margin-bottom:20px;">Your data is stored only on this app's own database — see the About page for exactly how.</p>
<div class="card"><form method="post"><div class="field"><label>Name</label><input type="text" name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password <span class="hint">(min. 8 characters)</span></label><input type="password" name="password" minlength="8" required></div><button class="btn-primary" type="submit" style="width:100%;">Create account</button></form><p style="margin-top:16px;font-size:13.5px;color:var(--ink-soft);">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></div>
{% endblock %}
